# KUYAKHANYA FM — website-to-apk configuration
# Tool: https://github.com/Jipok/website-to-apk
# Copies this config into the cloned repo as `webapk.conf`, then:
#     ./make.sh keygen
#     ./make.sh build
# The built APK is named `app-release.apk` in the repo root. Upload it to
#   frontend/kuyakhanya-frontend/public/downloads/kuyakhanya-fm.apk
# on this repo (kuyakhanyafm.web.app serves it directly, no-cache, as an attachment).

id = kuyakhanyafm                  # Application ID → com.kuyakhanyafm.webtoapk
name = KUYAKHANYA FM               # Display name on the device
mainURL = https://kuyakhanyafm.web.app
icon = icon.png                    # Drop an app icon PNG here (Kuyakhanya FM Icon.png works)

allowSubdomains = true
requireDoubleBackToExit = true

enableExternalLinks = true
openExternalLinksInBrowser = true
confirmOpenInBrowser = false

allowOpenMobileApp = false        # Keep listeners inside the app; no market:// schemes

# Open kuyakhanyafm.web.app links in the app instead of the browser
deeplink = kuyakhanyafm.web.app

DomStorageEnabled = true
JSEnabled = true
SavePassword = false
cacheMode = aggressive            # Offline-first: page loads fast after first visit
geolocationEnabled = false
cameraEnabled = false
microphoneEnabled = false

# NOTE: if you build with edgeToEdge = true, the radio PLAYER and bottom UI need
# safe-area padding (var(--safe-area-inset-bottom)). We have NOT enabled it.
edgeToEdge = false